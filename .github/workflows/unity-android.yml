# Builds the Unity client for Android with game-ci. UNVERIFIED: never run (written offline).
# Required repository secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE.
# Never put credentials in this file.
name: Unity Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - ".github/workflows/unity-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity shared copy is up to date
        run: scripts/sync-shared-to-unity.sh --check

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: client/GangsOfBharat.Unity/Library
          key: Library-Android-${{ hashFiles('client/GangsOfBharat.Unity/Packages/manifest.json') }}
          restore-keys: Library-Android-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: client/GangsOfBharat.Unity
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: GangsOfBharat

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GangsOfBharat-Android
          path: build/Android
